<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>Pesca na gruta · ESCÁRNIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@keyframes pg-in{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes pg-glow{0%,100%{text-shadow:0 0 18px rgba(200,132,26,.35)}50%{text-shadow:0 0 30px rgba(200,132,26,.7)}}
.pg-in{animation:pg-in .5s ease-out both}
.pg-ouro{animation:pg-in .5s ease-out both,pg-glow 2.6s ease-in-out .5s infinite}
.pg-hit{outline:none}
.pg-reg{transition:border-color .2s,background-color .2s}
.pg-reg:hover{border-color:#2c5a6a !important;background:rgba(10,22,40,.65) !important}
.pg-reg:focus-visible,.pg-fechar:focus-visible{outline:1px solid rgba(0,229,204,.6);outline-offset:2px}
.pg-fechar:hover{border-color:#2c5a6a !important;color:#e4f6fa !important}
.pg-tile{transition:border-color .15s,background-color .15s}
.pg-tile:hover{border-color:#2c5a6a !important}
.pg-tile:focus-visible{outline:1px solid rgba(0,229,204,.6);outline-offset:2px}
.pg-hit:focus-visible{box-shadow:inset 0 0 0 1px rgba(0,229,204,.45)}
@media (prefers-reduced-motion: reduce){.pg-in,.pg-ouro{animation:none}}
html,body{margin:0;height:100%;background:#050810;overflow:hidden;overscroll-behavior:none}
body{-webkit-text-size-adjust:100%;touch-action:none}
#palco{position:fixed;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
#pg-camp[hidden],#pg-gire[hidden]{display:none !important}
#pg-gire{position:fixed;left:16px;right:16px;bottom:24px;margin:0;text-align:center;font:italic 16px 'Crimson Pro',Georgia,serif;color:#7fa3b0;pointer-events:none}
#pg-casa{position:absolute;right:48px;bottom:44px;font:600 11px 'Cinzel',Georgia,serif;letter-spacing:.28em;color:#5d7d89;text-decoration:none;text-shadow:0 1px 12px rgba(0,0,0,.85);z-index:5}
#pg-casa:hover,#pg-casa:focus-visible{color:#8fb5c2;outline:none}
#pg-camp{position:absolute;right:48px;top:40px;width:430px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.9);z-index:6;transition:opacity .4s}
#pg-camp.pc-oculto{opacity:0}
#pc-cab{font:600 12px 'Cinzel',Georgia,serif;letter-spacing:.32em;color:#8fb5c2}
#pc-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#pc-lista li{font:17px/1.3 'Crimson Pro',Georgia,serif;color:#c8e8f0}
#pc-lista li.pc-i2{opacity:.8}#pc-lista li.pc-i3{opacity:.6}#pc-lista li.pc-i4{opacity:.42}
#pc-lista li.pc-novo{animation:pc-in .7s ease-out both}
#pc-lista b{font-weight:500;color:#e4f6fa}
.pc-sep{color:#4e7280}.pc-dim{color:#8fb5c2;font-style:italic}
.pc-num{font:500 14px 'IBM Plex Mono',ui-monospace,monospace;color:#c8e8f0}
.pc-r0{color:#c8e8f0}.pc-r1{color:#7fd8c8}.pc-r2,.pc-r3{color:#e2b062}.pc-coisa{color:#9aa9ad}
.pc-mit{font:600 13px 'Cinzel',Georgia,serif;letter-spacing:.14em;color:#bff7ee}
.pc-enc{font-style:italic;color:#8fd8cc}
.pc-vazio{font-style:italic;color:#7fa3b0 !important}
#pc-pe{max-width:400px;font:italic 15px/1.35 'Crimson Pro',Georgia,serif;color:#7fa3b0}
#pc-volta{pointer-events:auto;margin-top:2px;font:600 11px 'Cinzel',Georgia,serif;letter-spacing:.26em;color:#8fb5c2;text-decoration:none;border:1px solid rgba(26,58,92,.95);border-radius:4px;padding:7px 12px;background:rgba(5,10,18,.4)}
#pc-volta:hover,#pc-volta:focus-visible{border-color:#2c5a6a;color:#e4f6fa;outline:none}
@keyframes pc-in{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#pc-lista li.pc-novo{animation:none}}
</style>
</head>
<body>
<div id="palco"></div>
<template id="pg-molde">
<div ref="{{refRoot}}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #050810; font-family: 'Crimson Pro', Georgia, serif; color: #c8e8f0; user-select: none; -webkit-user-select: none">

  <!-- o mar, a gruta e a luz (placa de vídeo) e, por cima, a vara, a linha, a isca e o medidor -->
  <canvas ref="{{refGl}}" width="1440" height="900" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: block"></canvas>
  <canvas ref="{{refFx}}" width="1440" height="900" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: block"></canvas>

  <!-- vinheta: a pressão em volta do olhar -->
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 74% 72% at 50% 52%, rgba(2, 4, 8, 0) 55%, rgba(2, 4, 8, 0.45) 84%, rgba(1, 2, 4, 0.8) 100%)"></div>

  <!-- a tela do cinema: faixas, títulos, desafios de tempo e o painel da linha (não anda com a câmera) -->
  <canvas ref="{{refOv}}" width="1440" height="900" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: block; pointer-events: none"></canvas>

  <!-- a área inteira é o gesto: segurar arma, soltar arremessa, clicar recolhe -->
  <button ref="{{refHit}}" class="pg-hit" type="button" aria-label="{{rotulo}}" onPointerDown="{{onDown}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onKeyDown="{{onKey}}" onKeyUp="{{onKeyUp}}" onContextMenu="{{onMenu}}" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent"></button>

  <sc-if value="{{hud}}" hint-placeholder-val="{{ true }}">
    <!-- onde estamos -->
    <div style="position: absolute; left: 48px; top: 40px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.85)">
      <div style="font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: #8fb5c2">A GRUTA · MAR DE SALMOURA</div>
      <sc-if value="{{semEnc}}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{fPronto}}" hint-placeholder-val="{{ true }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">O mar não acaba daqui.</div>
      </sc-if>
      <sc-if value="{{fCarga}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Firme. Espere o ponto.</div>
      </sc-if>
      <sc-if value="{{fVoo}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">A linha corre.</div>
      </sc-if>
      <sc-if value="{{fAgua}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">A boia brilha lá longe.</div>
      </sc-if>
      <sc-if value="{{fBriga}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Algo lá embaixo puxou.</div>
      </sc-if>
      <sc-if value="{{fBrigaMit}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #bff7ee">Uma coisa antiga está na linha.</div>
      </sc-if>
      <sc-if value="{{fPego}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Fora d’água, a luz dele ainda pulsa.</div>
      </sc-if>
      <sc-if value="{{fRecolhe}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">A linha volta molhada de luz.</div>
      </sc-if>
      <sc-if value="{{fPerdeu}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">O mar ficou com a isca.</div>
      </sc-if>
      </sc-if>
      <sc-if value="{{eSombra}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Alguma coisa passa por baixo.</div>
      </sc-if>
      <sc-if value="{{eLuz1}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Lá no fundo, outra luz.</div>
      </sc-if>
      <sc-if value="{{eLuz2}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Ela piscou primeiro.</div>
      </sc-if>
      <sc-if value="{{eLinha1}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">Algo segurou a linha.</div>
      </sc-if>
      <sc-if value="{{eLinha2}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 21px; color: #c8e8f0">E soltou.</div>
      </sc-if>
      <sc-if value="{{chamado}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 17px; color: #8fd8cc">Lá do fundo, algo chamou.</div>
      </sc-if>
    </div>

    <!-- o registro do pescador -->
    <div style="position: absolute; left: 50px; bottom: 44px; display: flex; gap: 34px; pointer-events: none; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85)">
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.28em; color: #8fb5c2">ÚLTIMO</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #c8e8f0">{{ultimoTxt}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.28em; color: #8fb5c2">RECORDE</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #e2b062">{{recordeTxt}}</div>
      </div>
      <button class="pg-reg" type="button" onClick="{{abrirReg}}" aria-label="Abrir o registro de pesca" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin: -8px 0 0 -13px; padding: 7px 13px 6px; border: 1px solid rgba(26, 58, 92, 0.95); border-radius: 4px; background: rgba(5, 10, 18, 0.4); color: #c8e8f0; cursor: pointer; pointer-events: auto; font: inherit; text-shadow: inherit">
        <span style="display: block; font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.28em; color: #8fb5c2">REGISTRO</span>
        <span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #c8e8f0">{{especiesTxt}}</span>
      </button>
    </div>

    <!-- o que fazer agora -->
    <div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9)">
      <sc-if value="{{fPronto}}" hint-placeholder-val="{{ true }}">
        <div class="pg-in" style="font-style: italic; font-size: 18px; color: #9fc0cc">Segure para armar o arremesso · solte no ponto âmbar</div>
      </sc-if>
      <sc-if value="{{fCarga}}" hint-placeholder-val="{{ false }}">
        <div style="font-style: italic; font-size: 18px; color: #9fc0cc">Solte no ponto âmbar</div>
      </sc-if>
      <sc-if value="{{fAguaDica}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 18px; color: #9fc0cc">Quando a boia afundar, clique para fisgar</div>
        <div class="pg-in" style="font-style: italic; font-size: 15px; color: #7fa3b0">clicar antes disso recolhe a linha</div>
      </sc-if>
      <sc-if value="{{fBriga}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 18px; color: #9fc0cc">Segure e solte para manter o ponteiro no âmbar · alivie quando o peixe puxar</div>
      </sc-if>
      <sc-if value="{{fBrigaMit}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 18px; color: #9fc0cc">Mantenha o ponteiro no âmbar · nos golpes dele, clique no tempo certo</div>
      </sc-if>
      <sc-if value="{{fPego}}" hint-placeholder-val="{{ false }}">
        <div class="pg-in" style="font-style: italic; font-size: 18px; color: #9fc0cc">Clique para devolver ao mar</div>
      </sc-if>
      <sc-if value="{{fRecolhe}}" hint-placeholder-val="{{ false }}">
        <div style="font-style: italic; font-size: 18px; color: #9fc0cc">Recolhendo a linha…</div>
      </sc-if>
    </div>

    <!-- avisos no alto: o arremesso e o que acontece na linha -->
    <sc-if value="{{mostraAviso}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 0; right: 0; top: 58px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; text-shadow: 0 1px 16px rgba(0, 0, 0, 0.9)">
        <sc-if value="{{aPerfeito}}" hint-placeholder-val="{{ false }}">
          <div class="pg-ouro" style="font-family: 'Cinzel', serif; font-size: 30px; font-weight: 600; letter-spacing: 0.3em; color: #e8b460">PERFEITO</div>
        </sc-if>
        <sc-if value="{{aBom}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #e4f6fa">BOM ARREMESSO</div>
        </sc-if>
        <sc-if value="{{aFraco}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">FRACO</div>
        </sc-if>
        <sc-if value="{{aPassou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">PASSOU DO PONTO</div>
        </sc-if>
        <sc-if value="{{temDist}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 500; letter-spacing: 0.06em; color: #c8e8f0">{{distTxt}}</div>
        </sc-if>
        <sc-if value="{{novoRecorde}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #e2b062">novo recorde</div>
        </sc-if>
        <sc-if value="{{aFisgou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-ouro" style="font-family: 'Cinzel', serif; font-size: 30px; font-weight: 600; letter-spacing: 0.3em; color: #e8b460">FISGOU</div>
        </sc-if>
        <sc-if value="{{aNaVolta}}" hint-placeholder-val="{{ false }}">
          <div class="pg-ouro" style="font-family: 'Cinzel', serif; font-size: 30px; font-weight: 600; letter-spacing: 0.3em; color: #e8b460">FISGOU NA VOLTA</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">Algo atacou a isca no caminho de volta. Segure para recolher.</div>
        </sc-if>
        <sc-if value="{{aCedo}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">CEDO DEMAIS</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">Era só uma beliscada. O peixe se assustou.</div>
        </sc-if>
        <sc-if value="{{aEscapou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">ESCAPOU</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">A boia voltou à tona. Outro pode vir.</div>
        </sc-if>
        <sc-if value="{{aArrebentou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #e2b062">A LINHA ARREBENTOU</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">Você puxou junto com ele por tempo demais.</div>
        </sc-if>
        <sc-if value="{{aFugiu}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">O PEIXE FUGIU</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">Fora do âmbar, ele ganhou distância demais.</div>
        </sc-if>
        <sc-if value="{{aEscorregou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">ESCORREGOU DO ANZOL</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">Não era peixe. O fundo pegou de volta.</div>
        </sc-if>
        <sc-if value="{{aLiberto}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #bff7ee">{{libertoTxt}}</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">O mar fechou por cima, como se nunca tivesse aberto.</div>
        </sc-if>
        <sc-if value="{{aSoltou}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.26em; color: #a9c6cf">O PEIXE SOLTOU</div>
          <div class="pg-in" style="font-style: italic; font-size: 17px; color: #9fc0cc">A linha ficou frouxa por tempo demais.</div>
        </sc-if>
      </div>
    </sc-if>

    <!-- o peixe na mão: o registro dele -->
    <sc-if value="{{fPego}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 0; right: 0; top: 46px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; text-shadow: 0 1px 16px rgba(0, 0, 0, 0.95)">
        <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.36em; color: {{rarCor}}">{{peixeRaridade}}</div>
        <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 34px; font-weight: 600; letter-spacing: 0.12em; color: {{nomeCor}}">{{peixeNome}}</div>
        <div class="pg-in" style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.04em; color: #c8e8f0">{{peixeMedidas}}</div>
        <div class="pg-in" style="max-width: 560px; font-style: italic; font-size: 19px; line-height: 1.35; color: #9fc0cc; text-align: center">{{peixeDesc}}</div>
        <sc-if value="{{peixeCor}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; color: #e8b460">{{peixeCorTxt}}</div>
        </sc-if>
        <sc-if value="{{peixeNova}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-style: italic; font-size: 16px; color: #e2b062">{{peixeNovaTxt}}</div>
        </sc-if>
        <sc-if value="{{peixeMaior}}" hint-placeholder-val="{{ false }}">
          <div class="pg-in" style="font-style: italic; font-size: 16px; color: #e2b062">{{peixeMaiorTxt}}</div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{semGl}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; right: 48px; top: 42px; max-width: 300px; font-style: italic; font-size: 16px; color: #9fc0cc; text-align: right; pointer-events: none">Este navegador não desenhou a água: a placa de vídeo está desligada para a página.</div>
    </sc-if>
  </sc-if>

  <sc-if value="{{regAberto}}" hint-placeholder-val="{{ false }}">
    <div onPointerDown="{{regFundo}}" onKeyDown="{{regKey}}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2, 5, 10, 0.8)">
      <section class="pg-in" role="dialog" aria-modal="true" aria-label="Registro de pesca" style="width: 1180px; box-sizing: border-box; padding: 28px 40px 30px; display: flex; flex-direction: column; gap: 18px; background: linear-gradient(180deg, rgba(10, 22, 40, 0.97), rgba(5, 10, 18, 0.98)); border: 1px solid #1a3a5c; border-radius: 6px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(143, 181, 194, 0.06)">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">

    '  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y); }',
    'vec3 noised(vec2 x){ vec2 i = floor(x); vec2 f = fract(x);',
    '  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0); vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);',
    '  float a = hash12(i); float b = hash12(i + vec2(1.0, 0.0)); float c = hash12(i + vec2(0.0, 1.0)); float d = hash12(i + vec2(1.0, 1.0));',
    '  float k1 = b - a; float k2 = c - a; float k4 = a - b - c + d;',
    '  return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du * (vec2(k1, k2) + k4 * u.yx)); }',
    'float fbm3(vec2 p){ float a = 0.0; float b = 0.5; for (int i = 0; i < 3; i++) { a += b * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); b *= 0.5; } return a; }',
    // o contorno da boca da gruta (em px do desenho, y para baixo)
    'float s1(float x, float seed){ return vnoise(vec2(x, seed)) * 2.0 - 1.0; }',
    'float f1(float x, float seed){ return s1(x, seed) * 0.58 + s1(x * 2.13 + 1.7, seed + 3.1) * 0.27 + s1(x * 4.71 + 3.3, seed + 7.9) * 0.15; }',
    'float stal(float x){ float s = 0.0; float cw = 52.0; float ci = floor(x / cw);',
    '  for (int k = -1; k <= 1; k++) { float c = ci + float(k); float h = hash11(c * 1.731 + 0.31);',
    '    float cx = (c + 0.2 + 0.6 * hash11(c * 3.17 + 2.0)) * cw; float L = mix(14.0, 112.0, pow(hash11(c * 7.71 + 5.0), 1.6));',
    '    float w = mix(6.0, 19.0, hash11(c * 5.37 + 1.0)); float u = abs(x - cx) / w;',
    '    float lump = 1.0 + 0.18 * sin(u * 9.0 + c * 3.7) * (1.0 - u);',
    '    float pr = (u < 1.0 && h > 0.38) ? L * pow(1.0 - u, 1.55 + 0.6 * hash11(c * 2.3)) * lump : 0.0; s = max(s, pr); }',
    '  return s; }',
    'float ceilY(float x){ float dx = x - 720.0; return 92.0 + 0.00062 * dx * dx + 26.0 * f1(x * 0.0042, 1.0) + 8.0 * f1(x * 0.021, 2.0) + stal(x); }',
    'float leftX(float y){ return 70.0 + 175.0 * exp(-pow((y - 600.0) / 230.0, 2.0)) + 38.0 * f1(y * 0.0058, 3.0) + 11.0 * f1(y * 0.03, 4.0); }',
    'float rightX(float y){ return 1440.0 - (60.0 + 190.0 * exp(-pow((y - 540.0) / 250.0, 2.0)) + 38.0 * f1(y * 0.0058, 5.0) + 11.0 * f1(y * 0.03, 6.0)); }',
    'float ledgeY(float x){ return 792.0 - 72.0 * exp(-pow((x - 1230.0) / 270.0, 2.0)) - 32.0 * exp(-pow((x - 170.0) / 210.0, 2.0)) + 13.0 * f1(x * 0.008, 7.0) + 4.5 * f1(x * 0.05, 8.0); }',
'float rockD(vec2 p){ return max(max(ceilY(p.x) - p.y, leftX(p.y) - p.x), max(p.x - rightX(p.y), p.y - ledgeY(p.x))); }',
    'vec3 tone(vec3 c){ c = 1.0 - exp(-c * 1.7); c = pow(c, vec3(1.0 / 2.2)); return mix(c, c * c * (3.0 - 2.0 * c), 0.35); }'
  ].join('\n');

  // a rocha: desenhada uma vez numa textura (relevo, luz dos fungos, sombra, umidade)
  var ROCK = COMMON + '\n' + [
    'uniform vec4 uL[8]; uniform vec3 uLc[8]; uniform float uMaskOnly;',
    'const mat2 M2 = mat2(0.8, 0.6, -0.6, 0.8); const mat2 M2I = mat2(0.8, -0.6, 0.6, 0.8);',
    'vec3 fbmd(vec2 x, int oct){ float a = 0.0; float b = 0.5; vec2 d = vec2(0.0); mat2 m = mat2(1.0, 0.0, 0.0, 1.0);',
    '  for (int i = 0; i < 6; i++) { if (i >= oct) break; vec3 n = noised(x); a += b * n.x; d += b * (m * n.yz); b *= 0.5; x = 2.0 * (M2 * x); m = 2.0 * (M2I * m); }',
    '  return vec3(a, d); }',
    'void main(){',
    '  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uScale;',
    '  float d0 = rockD(p); vec2 g = vec2(rockD(p + vec2(1.0, 0.0)) - d0, rockD(p + vec2(0.0, 1.0)) - d0);',
    '  float gl = max(length(g), 0.05); float gn = mix(gl, 1.0, smoothstep(4.0, 26.0, d0)); float sd = d0 / gn;',
    '  float mask = clamp(sd * uScale + 0.5, 0.0, 1.0);',
    '  if (uMaskOnly > 0.5) { gl_FragColor = vec4(mask); return; }',
    '  if (mask <= 0.0) { gl_FragColor = vec4(0.0); return; }',
    '  float e = max(sd, 0.0); vec2 o2 = -g / gl;',
    '  vec3 h1 = fbmd(p * 0.0105, 5); vec3 h2 = fbmd(p * 0.055 + 17.0, 3);',
    '  float hgt = h1.x * 0.72 + h2.x * 0.28; vec2 hd = h1.yz * (0.0105 * 0.72) + h2.yz * (0.055 * 0.28);',
    '  float bend = 1.7 * exp(-e / 55.0);',
    '  vec3 N0 = normalize(vec3(o2.x * bend, -o2.y * bend, 1.0));',
    '  vec3 N = normalize(N0 + vec3(-hd.x, hd.y, 0.0) * 34.0);',
    '  vec3 P3 = vec3(p.x, -p.y, hgt * 26.0);',
    '  float vr = vnoise(p * 0.018 + 3.0);',
    '  vec3 alb = mix(vec3(0.020, 0.026, 0.032), vec3(0.040, 0.046, 0.050), vr) * (0.7 + 0.6 * h2.x);',
    '  float ao = (0.45 + 0.55 * smoothstep(0.2, 0.8, hgt)) * (0.45 + 0.55 * exp(-e / 160.0));',
    '  vec3 col = alb * vec3(0.05, 0.08, 0.11) * ao;',
    '  vec3 Lm = normalize(vec3(735.0, -352.0, -420.0) - P3);',
    '  col += alb * GLOWC * max(dot(N, Lm), 0.0) * 1.1 * exp(-e / 120.0) * uGlow;',
    '  vec3 Lb = normalize(vec3(0.0, -0.85, -0.3));',
    '  col += alb * HAZE * 6.0 * max(dot(N, Lb), 0.0) * exp(-e / 200.0) * uGlow;',
    '  float lacc = 0.0;',
    '  for (int i = 0; i < 8; i++) { vec4 L = uL[i]; vec3 v = vec3(L.x, -L.y, 34.0) - P3; float dist = length(v);',
    '    float att = pow(max(1.0 - dist / L.z, 0.0), 2.2) * L.w; float nd = max(dot(N, v / dist), 0.0);',
    '    col += alb * uLc[i] * att * nd * 5.5; lacc += att * nd;',
    '    vec3 hv = normalize(v / dist + vec3(0.0, 0.0, 1.0)); col += uLc[i] * att * pow(max(dot(N, hv), 0.0), 40.0) * 0.06; }',
    '  float film = smoothstep(0.62, 0.82, vnoise(p * 0.045 + 31.0)) * smoothstep(0.0, 0.25, lacc);',
    '  col += vec3(0.0, 0.5, 0.42) * film * 0.05;',
    '  vec2 sc = floor(p * 0.85); float spk = step(0.991, hash12(sc)) * (0.4 + 0.6 * hash12(sc + 7.0));',
    '  col += spk * (col * 6.0 + vec3(0.003, 0.006, 0.007));',
    '  col += GLOWC * uGlow * (0.035 * exp(-e / 12.0) + 0.10 * exp(-e / 1.8));',
    '  float ly = ledgeY(p.x);',
    '  if (p.y > ly - 2.0) { float wet = exp(-(p.y - ly) / 46.0); vec3 R = reflect(vec3(0.0, 0.0, -1.0), N);',
    '    col += GLOWC * pow(max(dot(R, Lm), 0.0), 16.0) * 0.35 * wet * uGlow; }',
    '  col = tone(col);',
    '  gl_FragColor = vec4(col * mask, mask);',
    '}'
  ].join('\n');

  function wavesGLSL() {
    return WV.map(function (w) {
      return '  { float fd = 1.0 - smoothstep(' + f5(0.6 * w.tl) + ', ' + f5(1.25 * w.tl) + ', t);' +
        ' float ph = ' + f5(w.k) + ' * dot(vec2(' + f5(w.dx) + ', ' + f5(w.dz) + '), xz) - ' + f5(w.om) + ' * uTw + ' + f5(w.ph) + ';' +
        ' float ak = ' + f5(w.A * w.k) + '; grad += ak * vec2(' + f5(w.dx) + ', ' + f5(w.dz) + ') * cos(ph) * fd; vr += 0.5 * ak * ak * (1.0 - fd); }';
    }).join('\n');
  }

  // o mar e o "céu" da caverna, a cada quadro
  var SEA = COMMON + '\n' + [
    'uniform float uTime; uniform sampler2D uRock;',
    'uniform vec4 uSplash; uniform vec4 uFloat; uniform vec4 uLure; uniform vec4 uWake[6]; uniform vec4 uFish; uniform vec3 uFishC; uniform vec4 uCam; uniform vec2 uCamT; uniform float uTw; uniform vec4 uEnc; uniform vec4 uEnc2; uniform float uSil;',
    'vec3 rayDir(vec2 p){ float u = (p.x - 720.0) / F; float v = (450.0 - p.y) / F; return normalize(vec3(u, v * CP - SP, v * SP + CP)); }',
    'vec3 skyCol(vec3 d){',
    '  vec3 top = vec3(0.0008, 0.0018, 0.0032);',
    '  float hb = exp(-max(d.y, 0.0) * 30.0);',
    '  vec3 c = mix(top, HAZE * uGlow, hb);',
    '  vec3 dd = normalize(vec3(d.x, d.y * 2.6, d.z));',
    '  float g = max(dot(dd, normalize(vec3(LDIR.x, LDIR.y * 2.6, LDIR.z))), 0.0);',
    '  c += GLOWC * (pow(g, 1400.0) * 1.1 + pow(g, 220.0) * 0.40 + pow(g, 30.0) * 0.09 + pow(g, 5.0) * 0.018) * uGlow;',
    '  return c; }',
    'vec3 skyPart(vec2 p, vec3 rd){',
    '  vec3 c = skyCol(rd);',
    '  float mb = exp(-abs(p.y - HY) / 26.0);',
    '  float mn = fbm3(vec2(p.x * 0.0032 + uTime * 0.005, p.y * 0.02 - uTime * 0.003));',
    '  c += HAZE * mb * (0.4 + 1.0 * mn) * 0.8 * uGlow;',
    '  vec2 gv = p - vec2(852.0, 334.0); float gr = length(gv); float ga = atan(gv.x, -gv.y);',
    '  float ry = fbm3(vec2(ga * 6.0, uTime * 0.025)) * 0.65 + fbm3(vec2(ga * 17.0 + 3.0, -uTime * 0.04)) * 0.35;',
    '  c += GLOWC * 0.013 * uGlow * smoothstep(0.42, 0.78, ry) * exp(-gr / 340.0) * smoothstep(10.0, 70.0, gr) * smoothstep(0.0, 12.0, HY - p.y);',
    '  float m2 = fbm3(vec2(p.x * 0.0019 - uTime * 0.003, p.y * 0.006 + 4.0));',
    '  c += HAZE * 0.35 * smoothstep(0.45, 0.85, m2) * exp(-(HY - p.y) / 120.0) * uGlow;',
    // uma torre muito longe, quase apagada (um segredo pequeno)
    '  float sx = abs(p.x - 418.0); float sh = HY - p.y;',
    '  float tw = 2.2 + 5.5 * pow(max(1.0 - sh / 40.0, 0.0), 0.6);',
    '  float spire = smoothstep(tw + 0.8, tw - 0.8, sx) * step(-1.0, sh) * smoothstep(41.0, 38.0, sh);',
    '  c = mix(c, c * 0.5, spire * 0.55 * (1.0 - 0.5 * mb));',
    '  float win = exp(-pow(length(vec2(p.x - 418.0, p.y - (HY - 27.0))) / 1.3, 2.0));',
    '  c += vec3(0.55, 0.30, 0.06) * win * (0.06 + 0.04 * sin(uTime * 0.7)) * uGlow;',
    '  return c; }',
    'vec3 seaPart(vec2 p, vec3 rd){',
    '  float t = HC / -rd.y; vec2 xz = vec2(rd.x, rd.z) * t;',
    '  vec2 grad = vec2(0.0); float vr = 0.0012;',
    wavesGLSL(),
    '  float df = 1.0 - smoothstep(5.0, 20.0, t);',
    '  vec3 nd = noised(xz * 2.4 + vec2(uTw * 0.32, -uTw * 0.45));',
    '  grad += nd.yz * 2.4 * 0.010 * df; vr += 0.0003 * (1.0 - df);',
    '  float dm = 1.0 - smoothstep(14.0, 46.0, t);',
    '  vec3 nm = noised(xz * 0.85 + vec2(-uTw * 0.21, -uTw * 0.33) + 40.0);',
    '  grad += nm.yz * 0.85 * 0.028 * dm; vr += 0.0012 * (1.0 - dm);',
    '  float lumi = 0.0;',
    // o respingo: anéis que se abrem e acendem o plâncton
    '  if (uSplash.w > 0.0) { vec2 dv = xz - uSplash.xy; float r = length(dv) + 0.0001; float age = uTime - uSplash.z;',
    '    if (age > 0.0 && age < 9.0) { float R1 = 0.25 + 1.55 * age; float R2 = 0.15 + 0.95 * age; float w1 = 0.30 + 0.10 * age;',
    '      float e1 = exp(-pow((r - R1) / w1, 2.0)) * exp(-0.55 * age) * uSplash.w;',
    '      float e2 = exp(-pow((r - R2) / (w1 * 0.8), 2.0)) * exp(-0.8 * age) * uSplash.w;',
    '      grad += (e1 * cos(8.0 * (r - R1)) * 0.30 + e2 * cos(10.0 * (r - R2)) * 0.22) * dv / r;',
    '      lumi += exp(-pow((r - R1) / 0.16, 2.0)) * exp(-0.45 * age) * uSplash.w * 0.9 + exp(-r * r / 0.5) * exp(-2.6 * age) * uSplash.w * 2.5; } }',
    // a boia: anéis pequenos e a luz dela na água
    '  if (uFloat.z > 0.0) { vec2 dv = xz - uFloat.xy; float r = length(dv) + 0.0001; float ab = mod(uTime - uFloat.w, 2.0);',
    '    float Rb = 0.1 + 0.5 * ab; float eb = exp(-pow((r - Rb) / 0.06, 2.0)) * exp(-1.4 * ab) * uFloat.z;',
    '    grad += eb * cos(14.0 * (r - Rb)) * 0.18 * dv / r;',
    '    lumi += exp(-r * r / 1.3) * 0.5 * uFloat.z + exp(-r * r / 0.12) * 0.5 * uFloat.z + eb * 0.45; }',
    // o rastro quando a linha é recolhida
    '  for (int i = 0; i < 6; i++) { vec4 wk = uWake[i]; if (wk.w > 0.0) { vec2 dv = xz - wk.xy; float r = length(dv) + 0.0001; float aw = uTime - wk.z;',
    '    if (aw > 0.0 && aw < 2.5) { float Rw = 0.1 + 0.9 * aw; float ew = exp(-pow((r - Rw) / 0.09, 2.0)) * exp(-1.6 * aw) * wk.w;',
    '      grad += ew * cos(12.0 * (r - Rw)) * 0.2 * dv / r; lumi += ew * 0.35; } } }',
    '  float sh = 0.0; float shE = 0.0;',
    '  if (uEnc.z > 0.0) { vec2 q = p - uEnc.xy; float ca = cos(uEnc.w); float sa = sin(uEnc.w);',
    '    vec2 lq = vec2(ca * q.x + sa * q.y, -sa * q.x + ca * q.y); float u = lq.x / uEnc2.x; float uu = clamp(u, -1.0, 1.0);',
    '    float nada = 1.0 + 0.09 * sin(u * 7.0 - uTime * 1.3);',
    '    float wv = uEnc2.y * pow(max(1.0 - uu * uu, 0.0), 0.62) * (0.42 + 0.58 * smoothstep(-1.0, 0.55, uu)) * nada;',
    '    float asa = uEnc2.y * (1.12 + 0.1 * sin(uTime * 0.8)) * exp(-pow((u - 0.32) / 0.26, 2.0));',
    '    float wt = max(max(wv, asa), 0.5); float dn = abs(lq.y + 0.12 * uEnc2.y * sin(u * 3.0 + uTime * 0.6)) / wt; float fu = 1.0 - smoothstep(0.86, 1.12, abs(u));',
    '    sh = (1.0 - smoothstep(0.3, 1.3, dn)) * fu * uEnc.z;',
    '    shE = exp(-pow((dn - 1.12) / 0.22, 2.0)) * fu * uEnc.z * (0.3 + 0.7 * smoothstep(-0.7, 0.6, u));',
    '    float hu = exp(-pow(u / 0.75, 2.0) - pow(lq.y / (uEnc2.y * 2.2), 2.0)) * uEnc.z;',
    '    grad *= 1.0 - 0.55 * hu; }',
    '  vec3 n = normalize(vec3(-grad.x, 1.0, -grad.y));',
    '  vec3 V = -rd; float cv = clamp(dot(n, V), 0.0, 1.0);',
    '  float fr = 0.02 + 0.98 * pow(1.0 - cv, 5.0);',
    '  vec3 r3 = reflect(rd, n); r3.y = abs(r3.y);',
    '  vec3 col = mix(DEEP * (1.0 - 0.9 * sh), skyCol(r3), fr);',
    // o brilho do outro lado se quebra nas ondas: a trilha
    '  vec3 hv = normalize(LDIR + V); float nh = max(dot(n, hv), 0.001); float nh2 = nh * nh;',
    '  float Dm = exp(-(1.0 - nh2) / (nh2 * vr)) / (3.14159 * vr * nh2 * nh2);',
    '  float fh = 0.02 + 0.98 * pow(1.0 - max(dot(hv, V), 0.0), 5.0);',
    '  col += GLOWC * Dm * fh * 0.035 / max(4.0 * cv, 0.08) * uGlow;',
    '  col *= 1.0 - 0.88 * sh;',
    // plâncton que acende sozinho
    '  if (t < 42.0 || shE > 0.01) { vec2 cell = floor(xz / 0.85); vec2 hp = hash22(cell); vec2 sp = (cell + 0.15 + 0.7 * hp) * 0.85;',
    '    float px = length(xz - sp) * F / t; float twk = pow(0.5 + 0.5 * sin(uTime * (0.6 + 1.6 * hp.x) + hp.y * 40.0), 8.0);',
    '    float pv = exp(-px * px * 0.9) * (1.0 - sh) * (1.0 - 0.95 * uSil);',
    '    col += vec3(0.0, 0.9, 0.78) * pv * (twk * max(1.0 - t / 42.0, 0.0) * 0.9 + shE * (0.55 + 0.45 * sin(uTime * 2.3 + hp.x * 30.0))); }',
    '  col += vec3(0.0, 0.85, 0.75) * lumi * 0.35 * (1.0 - 0.85 * sh) * (1.0 - 0.6 * uSil);',
    '  if (shE > 0.002) { float rn = vnoise(xz * vec2(1.3, 0.9) + vec2(uTime * 0.45, -uTime * 0.3)); col += vec3(0.0, 0.8, 0.7) * shE * (0.22 + 0.78 * smoothstep(0.38, 0.8, rn)) * 0.075; }',
    // um peixe fisgado: a luz dele atravessa a água
    '  if (uFish.z > 0.0) { vec2 fv = xz - uFish.xy; col += uFishC * exp(-dot(fv, fv) / uFish.w) * uFish.z * 0.32; }',
    // a isca no ar: um ponto de luz que se reflete
    '  if (uLure.w > 0.0) { vec3 Lp = uLure.xyz - vec3(xz.x, 0.0, xz.y); float dl = length(Lp); Lp /= dl;',
    '    col += vec3(0.1, 0.95, 0.85) * pow(max(dot(r3, Lp), 0.0), 520.0) * uLure.w * 2.4 / (1.0 + dl * dl * 0.04);',
    '    col += vec3(0.0, 0.6, 0.55) * uLure.w * 0.05 / (1.0 + dl * dl * 0.45); }',
    // a névoa engole o horizonte
    '  float fg = 1.0 - exp(-t * 0.0075); col = mix(col, HAZE * 1.05 * uGlow, fg * 0.85);',
    '  col += HAZE * exp(-abs(p.y - HY) / 26.0) * 0.5 * uGlow;',
    // a água batendo na borda de pedra e na rocha do meio
    '  float wl = ledgeY(p.x) - p.y;',
    '  if (wl < 22.0) { float lap = 0.5 + 0.5 * sin(uTw * 1.3 + p.x * 0.013 + 2.0 * sin(p.x * 0.004 + uTw * 0.4));',
    '    float fn = vnoise(vec2(p.x * 0.08 + uTw * 0.6, wl * 0.25 - uTw * 0.9));',
    '    float fo = exp(-max(wl, 0.0) / (2.5 + 4.0 * lap)) * (0.35 + 0.65 * fn);',
    '    col += vec3(0.30, 0.55, 0.55) * fo * 0.05 + vec3(0.0, 0.85, 0.75) * fo * smoothstep(0.75, 0.95, fn) * 0.25; }',
    '  return col; }',
    'float caustic(vec2 p, float t){',
    '  vec2 q = p * 0.018;',
    '  float a = sin(q.x * 1.7 + t * 0.9 + 2.0 * sin(q.y * 1.3 - t * 0.7));',
    '  float b = sin(q.y * 2.1 - t * 0.8 + 2.0 * sin(q.x * 0.9 + t * 0.6));',
    '  return pow(clamp(1.0 - abs(a + b) * 0.5, 0.0, 1.0), 5.0); }',
    'void main(){',
    '  vec2 ps = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uScale - uCamT;',
    '  vec2 p = vec2(uCam.x * ps.x + uCam.y * ps.y, uCam.z * ps.x + uCam.w * ps.y);',
    '  vec3 rd = rayDir(p);',
    '  vec3 col = rd.y > -0.0004 ? skyPart(p, rd) : seaPart(p, rd);',
    '  col = tone(col);',
    '  vec4 rk = texture2D(uRock, vec2(p.x * uScale / uRes.x, 1.0 - p.y * uScale / uRes.y));',
    '  col = col * (1.0 - rk.a) + rk.rgb;',
    '  if (rk.a > 0.01) { float dc = ceilY(p.x) - p.y; if (dc > -2.0 && dc < 240.0) {',
    '    col += vec3(0.20, 0.55, 0.52) * caustic(p, uTime) * exp(-max(dc, 0.0) / 110.0) * 0.16 * uGlow * rk.a; } }',
    '  col += (hash12(gl_FragCoord.xy + fract(uTime * 7.13) * 91.0) - 0.5) / 255.0;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'

    var r = { tipo: tipo, autorUid: E.uid, autorNome: E.nome || 'Alguém', at: Date.now() };
    if (tipo === 'captura') {
      r.especie = String(d.id || ''); r.nome = String(d.nome || ''); r.rar = d.rar | 0; r.coisa = !!d.coisa; r.mitico = !!d.mitico;
      r.tam = String(d.tam || ''); r.peso = String(d.peso || ''); r.kg = +d.kg || 0; r.porte = String(d.porte || ''); r.cor = String(d.cor || ''); r.nova = !!d.nova;
    } else if (tipo === 'encontro') { if (!FRASE[d.k]) return; r.k = d.k; }
    else if (tipo === 'liberto') { r.especie = String(d.id || ''); r.nome = String(d.nome || ''); }
    else return;
    grava(r);
  };
  function grava(r) {
    if (!E.db) { E.fila.push(r); return; }
    E.db.collection('campaigns').doc(CODE).collection('pescaria').doc(E.cena).collection('registro').add(r)
      .catch(function (e) { console.warn('[pescaria] gravar', e && e.code); E.msg = 'Não consegui registrar na campanha' + (e && e.code ? ' (' + e.code + ')' : '') + '.'; desenha(); });
  }

  function linha(e) {
    var quem = e.autorUid === E.uid ? 'Você' : (e.autorNome || 'Alguém');
    if (e.tipo === 'encontro') return '<span class="pc-enc">' + esc(quem) + ' ' + esc(FRASE[e.k] || '') + '</span>';
    if (e.tipo === 'liberto') return '<b>' + esc(quem) + '</b> <span class="pc-sep">·</span> <span class="pc-mit">' + esc((e.nome || '').toUpperCase()) + '</span> <span class="pc-dim">se libertou</span>';
    var cls = e.mitico ? 'pc-mit' : (e.coisa ? 'pc-coisa' : 'pc-r' + Math.max(0, Math.min(3, e.rar | 0)));
    var nome = e.mitico ? (e.nome || '').toUpperCase() : (e.nome || '');
    return '<b>' + esc(quem) + '</b> <span class="pc-sep">·</span> <span class="' + cls + '">' + esc(nome) + '</span>' + (e.peso ? ' <span class="pc-sep">·</span> <span class="pc-num">' + esc(e.peso) + '</span>' : '');
  }
  function desenha() {
    var p = $('pg-camp'); if (!p) return;
    if (!CODE) { p.hidden = true; return; }
    p.hidden = false;
    p.classList.toggle('pc-oculto', !E.hud);
    $('pc-cab').textContent = E.aberta ? 'PESCARIA · ' + (E.camp || CODE).toUpperCase() : (E.camp ? E.camp.toUpperCase() : 'CAMPANHA ' + CODE);
    var ul = $('pc-lista'), html = '';
    if (E.aberta) {
      E.lista.slice(0, 5).forEach(function (e, i) {
        var novo = !E.vistos[e.id]; E.vistos[e.id] = 1;
        html += '<li class="' + (novo ? 'pc-novo ' : '') + 'pc-i' + i + '">' + linha(e) + '</li>';
      });
      if (!E.lista.length) html = '<li class="pc-vazio">Nada veio à linha ainda.</li>';
    }
    ul.innerHTML = html;
    var pe = '';
    if (E.msg) pe = esc(E.msg);
    else if (E.entrar) pe = 'Entre no ESCÁRNIO para pescar com a sua campanha.';
    else if (E.fechou) pe = 'O mestre encerrou a pescaria. O que vier agora fica só com você.';
    else if (E.uid && !E.aberta) pe = 'Nenhuma pescaria aberta nesta campanha. A pesca segue só sua.';
    else if (E.aberta) pe = 'O que vier para a sua linha cai no registro da campanha.';
    $('pc-pe').innerHTML = pe;
    var v = $('pc-volta'); v.href = './#/campanha/' + CODE; v.textContent = E.entrar ? 'entrar no ESCÁRNIO' : 'voltar à campanha';
    if (E.entrar) v.href = './';
  }
  // o HUD do jogo some no cinema e no registro: o painel some junto
  window.pgCampHud = function (V) { var h = !!(V && V.hud) && !(V && V.regAberto); if (h !== E.hud) { E.hud = h; desenha(); } };

  function nomeDe(c, u) {
    var s = c.sheets && c.sheets[u.uid], best = null;
    if (s && typeof s === 'object') {
      if (typeof s.charName === 'string') best = s;
      else Object.keys(s).forEach(function (k) { var x = s[k]; if (x && typeof x.charName === 'string' && (!best || (x.updatedAt || 0) > (best.updatedAt || 0))) best = x; });
    }
    if (best && best.charName) return String(best.charName).slice(0, 40);
    var m = (c.members || []).filter(function (x) { return x && x.uid === u.uid; })[0];
    return String((m && m.name) || u.displayName || (u.email ? u.email.split('@')[0] : 'Alguém')).slice(0, 40);
  }
  function ouve(id) {
    if (E.unsub) { E.unsub(); E.unsub = null; }
    E.lista = [];
    E.unsub = E.db.collection('campaigns').doc(CODE).collection('pescaria').doc(id).collection('registro').orderBy('at', 'desc').limit(8)
      .onSnapshot(function (q) { E.lista = q.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }); desenha(); },
        function (e) { console.warn('[pescaria] ouvir', e && e.code); });
  }
  function carrega(src) {
    return new Promise(function (ok, falha) { var s = document.createElement('script'); s.src = src; s.async = false; s.onload = ok; s.onerror = falha; document.head.appendChild(s); });
  }
  function inicia() {
    try { if (!firebase.apps.length) firebase.initializeApp(CFG); } catch (e) {}
    var auth = firebase.auth(); E.db = firebase.firestore();
    var unsubCamp = null;
    auth.onAuthStateChanged(function (u) {
      if (unsubCamp) { unsubCamp(); unsubCamp = null; }
      if (!u) { E.uid = null; E.entrar = true; E.aberta = false; desenha(); return; }
      E.uid = u.uid; E.entrar = false;
      unsubCamp = E.db.collection('campaigns').doc(CODE).onSnapshot(function (snap) {
        if (!snap.exists) { E.msg = 'Campanha não encontrada.'; E.aberta = false; desenha(); return; }
        var c = snap.data() || {};
        var membro = c.masterUid === u.uid || (c.members || []).some(function (m) { return m && m.uid === u.uid; });
        if (!membro) { E.msg = 'Você não está nesta campanha.'; E.aberta = false; desenha(); return; }
        E.msg = ''; E.camp = c.name || CODE; E.nome = nomeDe(c, u);
        var p = c.pescaria || null;
        if (p && p.aberta && p.id) {
          if (E.cena !== p.id) { E.cena = String(p.id); E.vistos = {}; ouve(E.cena); }
          E.aberta = true; E.fechou = false; E.cenaNome = p.nome || '';
          var f = E.fila; E.fila = []; f.forEach(grava);
        } else { if (E.aberta) E.fechou = true; E.aberta = false; if (E.unsub) { E.unsub(); E.unsub = null; } }
        desenha();
      }, function (e) { E.msg = 'Não consegui ouvir a campanha' + (e && e.code ? ' (' + e.code + ')' : '') + '.'; desenha(); });
    });
  }
  window.pgCampInicia = function () {
    desenha();
    if (!CODE) return;
    var base = 'https://www.gstatic.com/firebasejs/9.23.0/';
    carrega(base + 'firebase-app-compat.js').then(function () { return carrega(base + 'firebase-auth-compat.js'); })
      .then(function () { return carrega(base + 'firebase-firestore-compat.js'); }).then(inicia)
      .catch(function () { E.msg = 'Sem conexão com a campanha. A pesca segue só sua.'; desenha(); });
  };
})();
</script>
<script>
/* monta o jogo no palco, encaixa o palco na janela e liga o painel da campanha */
(function () {
  'use strict';
  var palco = document.getElementById('palco'), molde = document.getElementById('pg-molde');
  var raiz = null;
  for (var c = molde.content.firstChild; c; c = c.nextSibling) if (c.nodeType === 1) { raiz = c; break; }
  var qs = null; try { qs = new URLSearchParams(location.search); } catch (e) {}
  var vel = qs && qs.get('vel'), VEL = { calma: 'calma', normal: 'normal', dificil: 'difícil', 'difícil': 'difícil' };
  var props = { velocidade: VEL[vel] || 'normal', brilho: 1, som: !(qs && qs.get('som') === '0'), hud: true, mitico: 'nenhum', encontro: 'ao acaso' };

  function encaixa() {
    // a janela de verdade (no celular, innerWidth cresce junto com o conteúdo largo)
    var de = document.documentElement, vv = window.visualViewport;
    var w = (vv && vv.width) || de.clientWidth || window.innerWidth || 1440, h = (vv && vv.height) || de.clientHeight || window.innerHeight || 900, s = Math.min(w / 1440, h / 900);
    palco.style.transform = 'translate(' + Math.round((w - 1440 * s) / 2) + 'px,' + Math.round((h - 900 * s) / 2) + 'px) scale(' + s + ')';
    var g = document.getElementById('pg-gire'); if (g) g.hidden = !(h > w * 1.15);
  }
  encaixa();
  window.addEventListener('resize', encaixa);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', encaixa);
  window.addEventListener('orientationchange', function () { setTimeout(encaixa, 250); });

  var comp = PGRuntime.monta(palco, raiz, Component, props, function (V) { if (window.pgCampHud) window.pgCampHud(V); });
  window.__pgComp = comp;
  // o painel da campanha vive dentro do palco, por cima do jogo
  var p = document.getElementById('pg-camp'); if (p) palco.appendChild(p);
  if (window.pgCampInicia) window.pgCampInicia();
  // o teclado já funciona sem clicar antes
  setTimeout(function () { var hit = palco.querySelector('.pg-hit'); if (hit) try { hit.focus({ preventScroll: true }); } catch (e) {} }, 300);
})();
(function () { var a = document.createElement('a'); a.id = 'pg-casa'; a.href = './'; a.textContent = 'ESCÁRNIO'; if (!/[?&]camp=/.test(location.search)) document.getElementById('palco').appendChild(a); })();
</script>
